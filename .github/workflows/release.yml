name: release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile-app/lib/**"
      - "mobile-app/android/**"
      - "mobile-app/pubspec.yaml"
      - "mobile-app/pubspec.lock"
      - ".github/workflows/release.yml"
      - ".github/workflows/checks.yml"

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build-release:
    name: build-release
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve version
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "tag=v${BASE}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version.outputs.base }} \
            --build-number=${{ github.run_number }} \
            --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app-${abi}-release.apk" "Pawlet-${abi}.apk"
          done

      # Same build-name/build-number as the APKs above, so the bundle Play
      # serves and the APKs on the GitHub release are one logical build.
      # No --split-per-abi: Play splits the bundle per device itself.
      - name: Build release bundle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.base }} \
            --build-number=${{ github.run_number }} \
            --dart-define=OPENROUTER_API_KEY="$OPENROUTER_API_KEY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: |
            mobile-app/build/app/outputs/flutter-apk/Pawlet-arm64-v8a.apk
            mobile-app/build/app/outputs/flutter-apk/Pawlet-armeabi-v7a.apk
            mobile-app/build/app/outputs/flutter-apk/Pawlet-x86_64.apk

      # Runs after the GitHub release so a rejected upload (most likely a
      # versionCode Play has already seen) cannot cost us the sideload APKs.
      # Promotion from internal to production stays manual in the Play Console.
      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pastabyte.pawlet
          releaseFiles: mobile-app/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Prune old releases (keep newest 5)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              [ -z "$tag" ] && continue
              echo "Deleting old release $tag"
              gh release delete "$tag" --cleanup-tag --yes
            done
