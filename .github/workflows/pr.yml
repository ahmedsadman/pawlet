name: ci

on:
  pull_request:
    paths:
      - "mobile-app/lib/**"
      - "mobile-app/android/**"
      - "mobile-app/pubspec.yaml"
      - "mobile-app/pubspec.lock"
      - ".github/workflows/pr.yml"
      - ".github/workflows/checks.yml"
      - ".github/workflows/release.yml"

# dorny/paths-filter reads the PR's changed-files list via the API, which needs
# pull-requests:read (the repo's default GITHUB_TOKEN is contents:read only).
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: detect-changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Filter Android-affecting paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            android:
              - "mobile-app/android/**"
              - "mobile-app/pubspec.yaml"
              - "mobile-app/pubspec.lock"
              - ".github/workflows/pr.yml"
              - ".github/workflows/checks.yml"

  checks:
    uses: ./.github/workflows/checks.yml

  build:
    name: build-debug
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No OpenRouter key is baked in. A key in a client APK is extractable, so
      # sideload users supply their own through Settings → Privacy.
      - name: Build debug APK
        run: flutter build apk --debug
