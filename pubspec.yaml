name: meowni
description: "Local-only SMS finance tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  another_telephony: ^0.4.1
  flutter_contacts: ^2.3.1
  sqflite: ^2.4.3
  path: ^1.9.1
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.0
  workmanager: ^0.10.5
  flutter_riverpod: ^3.4.2
  catppuccin_flutter: ^1.0.0
  flutter_local_notifications: ^19.0.0
  fl_chart: ^1.1.1
  package_info_plus: ^10.2.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  decimal: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true
