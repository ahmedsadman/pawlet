services:
  pawlet:
    build: .
    restart: unless-stopped
    env_file: .env
    # Bound to loopback, not 0.0.0.0. Caddy runs with network_mode: host, so it
    # reaches this through localhost; binding the host side to 127.0.0.1 keeps
    # the port off the public interface. Publishing "8091:8080" instead would
    # expose the API to the internet and bypass Caddy's TLS entirely.
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      # SQLite database and its WAL/SHM siblings.
      - pawlet-data:/data
      # Google service account JSON, read-only.
      - ./service-account.json:/run/secrets/sa.json:ro

volumes:
  pawlet-data:
