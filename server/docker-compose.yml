services:
  pawlet:
    # Deploys pull a prebuilt image; CI sets IMAGE_TAG to the commit SHA it
    # pushed. `build:` stays so `docker compose up --build` still works for
    # local development.
    image: ghcr.io/ahmedsadman/pawlet-server:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    # The deploy exports IMAGE_TAG for the image line above; pass it in so pawletd
    # can publish which image is running (falls back to "latest" under compose).
    environment:
      IMAGE_TAG: ${IMAGE_TAG:-latest}
    # Docker's default 10s is shorter than the 30s graceful shutdown plus final
    # flushes, so a slow drain would be SIGKILLed before counters are persisted.
    stop_grace_period: 40s
    # Bound to loopback, not 0.0.0.0. Caddy runs with network_mode: host, so it
    # reaches this through localhost; binding the host side to 127.0.0.1 keeps
    # the port off the public interface. Publishing "8091:8080" instead would
    # expose the API to the internet and bypass Caddy's TLS entirely.
    ports:
      - "127.0.0.1:8091:8080"
    # Run as the host user so the bind-mounted ./data stays readable and
    # writable without sudo. Override on a host where your uid is not 1000:
    #   PAWLET_UID=$(id -u) PAWLET_GID=$(id -g) docker compose up -d
    user: "${PAWLET_UID:-1000}:${PAWLET_GID:-1000}"
    volumes:
      # SQLite database and its WAL/SHM siblings, visible on the host at
      # server/data/ so backups and inspection need no docker gymnastics.
      - ./data:/data
      # Google service account JSON, read-only.
      - ./service-account.json:/run/secrets/sa.json:ro

  pawlet-admin:
    # The owner-only dashboard. Its own image so a dashboard change never
    # restarts the classify API.
    image: ghcr.io/ahmedsadman/pawlet-admin:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: server/admin.Dockerfile
    restart: unless-stopped
    # Not required, so a host without admin.env still deploys pawletd; the
    # admin container then exits on missing config and keeps retrying.
    env_file:
      - path: admin.env
        required: false
    # pawletd migrates the schema; the admin only reads it and refuses an
    # older schema, so it restarts until pawletd has finished.
    depends_on:
      - pawlet
    # Loopback only, like pawletd: Caddy terminates TLS for the admin host.
    ports:
      - "127.0.0.1:8092:8080"
    user: "${PAWLET_UID:-1000}:${PAWLET_GID:-1000}"
    volumes:
      # Read-write: SQLite readers in WAL mode need the -shm file, and ban /
      # unban write.
      - ./data:/data
