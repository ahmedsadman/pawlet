name: pawlet
description: "Local-only SMS finance tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  another_telephony: ^0.4.1
  sqflite: ^2.4.3
  path: ^1.9.1
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.0
  workmanager: ^0.10.5
  flutter_riverpod: ^3.4.2
  catppuccin_flutter: ^1.0.0
  flutter_local_notifications: ^19.0.0
  fl_chart: ^1.1.1
  package_info_plus: ^10.2.1
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  decimal: ^3.0.2
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  dart_bert_tokenizer: ^1.3.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#24273a"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  # foreground.png already carries the keyline padding; the plugin's default
  # 16% inset would shrink the art to ~45dp of the 108dp canvas.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/model/model.tflite
    - assets/model/tokenizer.json
